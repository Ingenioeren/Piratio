plugins {
    id 'com.android.application'
}

def pgsWebClientId = (project.findProperty('PIRATIO_PGS_WEB_CLIENT_ID') ?: System.getenv('PIRATIO_PGS_WEB_CLIENT_ID') ?: '').toString()
def pgsAppId = (project.findProperty('PIRATIO_PGS_APP_ID') ?: System.getenv('PIRATIO_PGS_APP_ID') ?: '0').toString()
def apiBaseUrl = (project.findProperty('PIRATIO_API_BASE_URL') ?: System.getenv('PIRATIO_API_BASE_URL') ?: '').toString()
def integrityProjectNumber = (project.findProperty('PIRATIO_INTEGRITY_PROJECT_NUMBER') ?: System.getenv('PIRATIO_INTEGRITY_PROJECT_NUMBER') ?: '0').toString()

def javaString = { value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }

configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

android {
    namespace 'com.gillingteknik.piratio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gillingteknik.piratio'
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName '0.7.0'

        buildConfigField 'String', 'PGS_WEB_CLIENT_ID', javaString(pgsWebClientId)
        buildConfigField 'String', 'API_BASE_URL', javaString(apiBaseUrl)
        buildConfigField 'long', 'INTEGRITY_PROJECT_NUMBER', integrityProjectNumber + 'L'
        manifestPlaceholders = [playGamesAppId: pgsAppId]
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-games-v2:22.0.0'
    implementation 'com.google.android.play:integrity:1.6.0'
    implementation 'com.android.billingclient:billing:9.1.0'
}
